<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>아침 1분 체크</title>
<!-- 공용 셸. 둘이 합의하고 동결한다.
     화면 내용은 #state에 measure.js(정상)와 measure-error.js(예외)가 그린다.
     body[data-chrome="none"]이면 머리말·단계·탭을 감춘다(E1·E2처럼 단독으로 서는 화면). -->
<link rel="stylesheet" href="../styles/base.css">
<link rel="stylesheet" href="./measure.css">
<link rel="stylesheet" href="./measure-error.css">

<header class="m-head">
  <button type="button" class="m-head__back" id="back" aria-label="뒤로">
    <img src="../assets/icons/back.svg" width="10" height="16" alt="">
  </button>
  <span class="m-head__brand">
    <img src="../assets/icons/logo.svg" width="20" height="20" alt="">
    Come &amp; down
  </span>
  <span class="m-head__pad"></span>
</header>

<!-- 중단·안내 토스트 (B3-2). measure-error.js가 채운다 -->
<div class="m-toast" id="toast" role="status" aria-live="polite" hidden></div>

<nav class="m-steps" aria-label="측정 단계">
  <ol>
    <li data-step="measurement" aria-current="step">1. 손가락 측정</li>
    <li aria-hidden="true">→</li>
    <li data-step="condition">2. 컨디션 체크</li>
    <li aria-hidden="true">→</li>
    <li data-step="breathing">3. 천천히 숨쉬기</li>
  </ol>
</nav>

<main class="m-main">
  <div class="m-camera" id="camera" hidden>
    <video id="video" playsinline muted></video>
    <canvas id="canvas" hidden></canvas>
  </div>
  <!-- 유일한 공유 지점 -->
  <div id="state" role="status" aria-live="polite"></div>
</main>

<nav class="m-tabs" aria-label="메뉴">
  <a href="../index.html"><img src="../assets/icons/tab-home.svg" width="19" height="17" alt="">홈</a>
  <a href="./calendar.html"><img src="../assets/icons/tab-calendar.svg" width="15" height="17" alt="">캘린더</a>
  <a href="./measure.html" aria-current="page"><img src="../assets/icons/tab-measure.svg" width="17" height="17" alt="">측정</a>
  <a href="./report.html"><img src="../assets/icons/tab-report.svg" width="15" height="17" alt="">리포트</a>
  <a href="./mypage.html"><img src="../assets/icons/tab-my.svg" width="15" height="17" alt="">MY</a>
</nav>

<script type="module" src="./measure.js"></script>
