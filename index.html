<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HRV 손가락 측정 모듈 테스트</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      max-width: 600px;
      margin: 0 auto;
      padding: 16px;
      line-height: 1.5;
    }
    .controls {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }
    button {
      padding: 10px 14px;
      font-size: 14px;
      cursor: pointer;
    }
    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }
    .option-row {
      margin-bottom: 12px;
      font-size: 14px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 16px;
      font-size: 14px;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 8px;
      text-align: left;
    }
    th {
      width: 38%;
      background: #f5f5f5;
    }
    canvas#waveCanvas {
      width: 100%;
      height: 140px;
      border: 1px solid #ccc;
      display: block;
      margin-bottom: 16px;
    }
    pre {
      background: #f5f5f5;
      padding: 12px;
      overflow-x: auto;
      font-size: 12px;
      border: 1px solid #ddd;
      min-height: 60px;
    }
  </style>
</head>
<body>
  <h2>HRV 측정 모듈 테스트</h2>

  <div class="option-row">
    <label>
      <input type="checkbox" id="skipUploadChk" checked />
      백엔드 전송 건너뛰기 (체크 시 70초 완료 후 바로 JSON 다운로드 가능)
    </label>
  </div>

  <div class="controls">
    <button id="btnStart">측정 시작</button>
    <button id="btnStop" disabled>중단</button>
    <button id="btnRetry" disabled>재전송 (retryUpload)</button>
    <button id="btnDownload" disabled>측정 데이터 JSON 다운로드</button>
  </div>

  <table>
    <tbody>
      <tr><th>현재 단계 (State)</th><td id="valState">-</td></tr>
      <tr><th>오류 / 상세</th><td id="valDetail">-</td></tr>
      <tr><th>경과 시간</th><td id="valTime">0.0s / 70.0s</td></tr>
      <tr><th>손가락 상태 (finger)</th><td id="valFinger">-</td></tr>
      <tr><th>흔들림 여부 (moving)</th><td id="valMoving">-</td></tr>
      <tr><th>실제 FPS</th><td id="valFps">0</td></tr>
      <tr><th>플래시 상태 (torch)</th><td id="valTorch">-</td></tr>
      <tr><th>촬영 시각 출처 (timeSource)</th><td id="valTimeSource">-</td></tr>
      <tr><th>수집 샘플 수</th><td id="valSamples">0</td></tr>
    </tbody>
  </table>

  <div><strong>실시간 파형 (wave)</strong></div>
  <canvas id="waveCanvas" width="560" height="140"></canvas>

  <div><strong>서버 응답 / 결과 JSON</strong></div>
  <pre id="responseBox">{}</pre>

  <script type="module">
    import { createHrvMeasurement, HRV_STATES, HRV_ERRORS } from './hrvMeasurement.js';

    const btnStart = document.getElementById('btnStart');
    const btnStop = document.getElementById('btnStop');
    const btnRetry = document.getElementById('btnRetry');
    const btnDownload = document.getElementById('btnDownload');
    const skipUploadChk = document.getElementById('skipUploadChk');

    const valState = document.getElementById('valState');
    const valDetail = document.getElementById('valDetail');
    const valTime = document.getElementById('valTime');
    const valFinger = document.getElementById('valFinger');
    const valMoving = document.getElementById('valMoving');
    const valFps = document.getElementById('valFps');
    const valTorch = document.getElementById('valTorch');
    const valExposureLocked = document.getElementById('valExposureLocked');
    const valTimeSource = document.getElementById('valTimeSource');
    const valSamples = document.getElementById('valSamples');
    const responseBox = document.getElementById('responseBox');

    const waveCanvas = document.getElementById('waveCanvas');
    const waveCtx = waveCanvas.getContext('2d');
    const waveHistory = [];
    const MAX_WAVE_POINTS = 180; // 약 3초 분량 파형 표시

    let currentSession = null;

    function drawWave() {
      const w = waveCanvas.width;
      const h = waveCanvas.height;
      waveCtx.clearRect(0, 0, w, h);

      // 중앙 기준선
      waveCtx.strokeStyle = '#e0e0e0';
      waveCtx.beginPath();
      waveCtx.moveTo(0, h / 2);
      waveCtx.lineTo(w, h / 2);
      waveCtx.stroke();

      if (waveHistory.length < 2) return;

      // 자동 스케일링 (최소 진폭 +-5 보장)
      let maxAbs = 5;
      for (const v of waveHistory) {
        if (Math.abs(v) > maxAbs) maxAbs = Math.abs(v);
      }

      waveCtx.strokeStyle = '#d32f2f';
      waveCtx.lineWidth = 2;
      waveCtx.beginPath();

      waveHistory.forEach((val, idx) => {
        const x = (idx / (MAX_WAVE_POINTS - 1)) * w;
        const y = h / 2 - (val / maxAbs) * (h * 0.42);
        if (idx === 0) waveCtx.moveTo(x, y);
        else waveCtx.lineTo(x, y);
      });
      waveCtx.stroke();
    }

    function updateMetaDisplay() {
      if (!currentSession) return;
      const data = currentSession.getCollectedData();
      valTorch.textContent = String(data.torch);
      valExposureLocked.textContent = String(data.exposureLocked);
      valTimeSource.textContent = data.timeSource || '-';
      valSamples.textContent = String(data.t.length);
    }

    btnStart.addEventListener('click', async () => {
      waveHistory.length = 0;
      drawWave();
      responseBox.textContent = '{}';
      valDetail.textContent = '-';
      btnRetry.disabled = true;
      btnDownload.disabled = true;

      currentSession = createHrvMeasurement({
        skipUpload: skipUploadChk.checked,
        onStateChange: (state, payload) => {
          valState.textContent = state;
          updateMetaDisplay();

          const isRunning = [
            HRV_STATES.PREPARING_CAMERA,
            HRV_STATES.WAITING_FINGER,
            HRV_STATES.WARMUP,
            HRV_STATES.MEASURING,
          ].includes(state);

          btnStart.disabled = isRunning || state === HRV_STATES.UPLOADING;
          btnStop.disabled = !isRunning;

          if (state === HRV_STATES.ERROR) {
            valDetail.textContent = String(payload);
            if (payload === HRV_ERRORS.UPLOAD_FAILED) {
              btnRetry.disabled = false;
              btnDownload.disabled = false;
            }
          } else if (state === HRV_STATES.DONE) {
            valDetail.textContent = '완료';
            btnDownload.disabled = false;
            responseBox.textContent = JSON.stringify(
              payload?.skippedUpload ? { message: '업로드 건너뜀 (로컬 수집 완료)' } : payload,
              null,
              2
            );
          } else if (state === HRV_STATES.STOPPED) {
            valDetail.textContent = '중단됨';
          }
        },
        onSignal: (signal) => {
          valFinger.textContent = signal.finger;
          valMoving.textContent = signal.moving ? '흔들림 (true)' : '안정 (false)';
          valFps.textContent = String(signal.fps);

          waveHistory.push(signal.wave);
          if (waveHistory.length > MAX_WAVE_POINTS) waveHistory.shift();
          drawWave();
          updateMetaDisplay();
        },
        onProgress: ({ elapsedMs, totalMs }) => {
          valTime.textContent = `${(elapsedMs / 1000).toFixed(1)}s / ${(totalMs / 1000).toFixed(1)}s`;
        },
      });

      await currentSession.start();
    });

    btnStop.addEventListener('click', () => {
      if (currentSession) currentSession.stop();
    });

    btnRetry.addEventListener('click', async () => {
      if (!currentSession) return;
      btnRetry.disabled = true;
      await currentSession.retryUpload();
    });

    btnDownload.addEventListener('click', () => {
      if (!currentSession) return;
      const data = currentSession.getCollectedData();
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);

      const safeTimestamp = (data.startedAt || new Date().toISOString()).replace(/[:+]/g, '-');
      const a = document.createElement('a');
      a.href = url;
      a.download = `hrv-measurement-${safeTimestamp}.json`;
      a.click();
      URL.revokeObjectURL(url);
    });
  </script>
</body>
</html>
